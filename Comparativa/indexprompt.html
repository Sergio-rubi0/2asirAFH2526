<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Precisión de IAs - Modelos MAC</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        #fractal-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at center, #050509 0%, #000 60%, #000 100%);
        }
        h1 {
            margin-bottom: 10px;
            text-align: center;
        }
        #info {
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }
        section.chart-container {
            width: 410px;
            max-width: 95vw;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }

        .botones-linea {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .botones-linea a {
            text-decoration: none;
        }
        .botones-linea button {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .btn-primera {
            background: #00c8ff;
            color: #000;
        }
        .btn-otras {
            background: #5a5a5a;
            color: #fff;
        }
        .botones-linea button:hover {
            opacity: 0.9;
        }
		.btn-container {
            width: 100%;
            text-align: right;
            margin-top: -35px;
			margin-left: -25px;
        }
        .btn-nav {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }
        .btn-nav:hover {
            background-color: #0056b3;
        }
		.bt-container {
			width: 100%;
			text-align: right;
			margin-top: -30px;
			margin-left: -2350px;
		}
		.bt-nav {
			display: inline-block;
			padding: 10px 20px;
			background-color: #007bff;
			color: #fff;
			text-decoration: none;
			border-radius: 4px;
			font-family: Arial, sans-serif;
		}
		.bt-nav:hover {
			background-color: #0056b3;
		}
    </style>
</head>
<body>
    <canvas id="fractal-bg"></canvas>

    <h1>Comparativa de prompts largos por IAs en MAC</h1>

    <section class="chart-container">
        <canvas id="iaPieChart" aria-label="Gráfica de aciertos por IA" role="img"></canvas>
        <div id="info">
            Pasa el ratón por cada sector para ver los aciertos de cada modelo de IA.
        </div>

        <div class="botones-linea">
            <a href="indexprompt.html">
                <button class="btn-primera">MAC</button>
            </a>
            <a href="otra-ia.html">
                <button class="btn-otras">Windows</button>
            </a>
        </div>
    </section>
	<div class="btn-container">
        <a href="tkspromptMAC.html" class="btn-nav">Ir a tk/s</a>
    </div>
	<div class="bt-container">
        <a href="index.html" class="bt-nav">Ir a acertijos</a>
    </div>
    <script>
        const bgCanvas = document.getElementById("fractal-bg");
        const bgCtx = bgCanvas.getContext("2d");
        function resizeBG() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeBG);
        resizeBG();
        const particleCount = 80;
        const maxDistance = 140;
        const particles = [];
        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                const speed = 0.4 + Math.random() * 0.6;
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.radius = 1 + Math.random() * 1.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > bgCanvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > bgCanvas.height) this.vy *= -1;
            }
            draw() {
                bgCtx.beginPath();
                bgCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = "rgba(130, 200, 255, 0.9)";
                bgCtx.fill();
            }
        }
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());
        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDistance) {
                        const alpha = 1 - dist / maxDistance;
                        bgCtx.strokeStyle = `rgba(0, 200, 255, ${alpha * 0.6})`;
                        bgCtx.lineWidth = 1;
                        bgCtx.beginPath();
                        bgCtx.moveTo(particles[i].x, particles[i].y);
                        bgCtx.lineTo(particles[j].x, particles[j].y);
                        bgCtx.stroke();
                    }
                }
            }
        }
        function animateBG() {
            bgCtx.fillStyle = "rgba(0, 0, 0, 0.35)";
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            drawConnections();
            requestAnimationFrame(animateBG);
        }
        animateBG();

        // Gráfica 1
        const ctx = document.getElementById("iaPieChart").getContext("2d");
        new Chart(ctx, {
            type: "pie",
            data: {
                labels: [
                    "IBM · Gratine-4-h-tiny (3/3)",
                    "Google · Gemma-3-12b (3/3)",
                    "OpenAI · gpt-oss-20b (3/3)"
                ],
                datasets: [{
                    label: "Aciertos sobre 3 prompts largos",
                    data: [3, 3, 3],
                    backgroundColor: ["#1f70c1", "#4285f4", "#5a5a5a"],
                    borderColor: ["#1f70c1", "#4285f4", "#5a5a5a"],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: true, position: "bottom", align: "center" },
                    tooltip: {
                        enabled: true,
                        callbacks: {
                            label: function(context) {
                                const label = context.label || "";
                                const value = context.parsed;
                                const total = [1,3,2].reduce((a,b)=>a+b,0);
                                const porcentaje = ((value / total) * 100).toFixed(1);
                                return `${label}: ${value} aciertos (${porcentaje}% del total de aciertos)`;
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
